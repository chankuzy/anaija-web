<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Offline · Anaija</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#0A0A0A;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
    img{width:72px;height:72px;border-radius:18px}
    h1{margin:8px 0 0;font-size:20px}
    p{margin:0;max-width:300px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.6)}
    button{margin-top:12px;height:48px;min-width:140px;border:0;border-radius:999px;background:#fff;color:#000;font-size:15px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your connection and try again. Anything you were posting is kept and will resume when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
